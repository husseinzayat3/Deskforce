name: Release

# Pushing a tag such as v0.2.0 builds the installers for macOS, Windows and Linux and puts them in a
# draft release. Read the draft, then publish it: only a published release is offered to
# people who download the app, and to installed apps that update themselves.
#
# The version in the tag must be the "version" of electron/package.json.
#
# Optional repository secrets (Settings → Secrets and variables → Actions). Without them the
# apps are built unsigned and the systems warn when they are first opened.
#   macOS:   MAC_CERTIFICATE (the Developer ID .p12, base64-encoded), MAC_CERTIFICATE_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE (the .pfx, base64-encoded), WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check that the tag matches the app's version
        run: |
          version=$(node -p 'require("./electron/package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but electron/package.json says $version." >&2
            exit 1
          fi

      - run: npm ci

      - name: Build the app (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_ARCH: both
          DESKFORCE_UPDATE_REPO: ${{ github.repository }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-desktop.sh

      - name: Build the app (Windows)
        if: runner.os == 'Windows'
        env:
          DESKFORCE_UPDATE_REPO: ${{ github.repository }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bash scripts/build-desktop.sh

      - name: Build the app (Linux)
        if: runner.os == 'Linux'
        env:
          DESKFORCE_UPDATE_REPO: ${{ github.repository }}
        run: bash scripts/build-desktop.sh

      # Nobody tries every build by hand, so each app is started here and its office asked
      # for an answer. A build that does not start never reaches the release.
      - name: Start the apps (macOS)
        if: runner.os == 'macOS'
        run: |
          # The Intel app runs on this Apple Silicon machine through Rosetta, which translates
          # the whole app on its first start; on a runner that can take minutes
          softwareupdate --install-rosetta --agree-to-license || true
          node scripts/smoke-desktop.js "dist-desktop/mac-arm64/Deskforce.app/Contents/MacOS/Deskforce"
          SMOKE_TIMEOUT_SECONDS=300 node scripts/smoke-desktop.js "dist-desktop/mac/Deskforce.app/Contents/MacOS/Deskforce"

      - name: Start the app (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-desktop.js dist-desktop/win-unpacked/Deskforce.exe

      # A virtual display, and no setuid sandbox helper: an installed .deb sets that one up
      - name: Start the app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a node scripts/smoke-desktop.js dist-desktop/linux-unpacked/deskforce --no-sandbox

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          # The installers, plus the files an installed app reads to find a newer version
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml

  # The server image, so people can `docker run` it without cloning. Pushed only after the
  # desktop apps built and started. Note: it is public as soon as this job ends, while the
  # release itself stays a draft until you publish it.
  docker:
    name: Publish the Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The image is built for Intel and ARM machines (Apple Silicon, Raspberry Pi, ARM servers)
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # v0.2.1 → tags 0.2.1, 0.2 and latest
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/husseinzayat3/deskforce
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --draft --verify-tag --generate-notes --title "Deskforce ${GITHUB_REF_NAME#v}"
