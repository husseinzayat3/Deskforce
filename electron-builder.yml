appId: io.github.husseinzayat3.deskforce
productName: Deskforce
copyright: Copyright © 2026 Hussein Zayat

directories:
  app: electron
  output: dist-desktop
  buildResources: build-desktop

files:
  - main.js
  - preload.js
  - package.json

# Kept as plain files so electron/after-pack.js can finish the bundle:
# it adds the Next.js server (.next-desktop/standalone) with the SQLite module
# for the app's processor, and signs the result when no Developer ID is used.
asar: false
afterPack: electron/after-pack.js

# The shell has no native modules; the server's one is prepared by scripts/build-desktop.sh
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: build-desktop/icon.icns
  # Needed for notarisation; has no effect on an ad-hoc signed build
  hardenedRuntime: true
  target:
    - dmg

dmg:
  title: "${productName} ${version}"

# Signing, notarisation, the update feed and the processors to build for are
# chosen by scripts/build-desktop.sh from environment variables.
